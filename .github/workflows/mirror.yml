name: 'mirror'
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    name: mirror
    steps:
      - name: mirror
        id: mirror
        uses: bridgelightcloud/github-mirror-action@v3
        with:
          origin: 'https://rad.hardenedbsd.org/src.git'
          GITHUB_TOKEN: ${{ secrets.MIRROR_TOKEN }}
